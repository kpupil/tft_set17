<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>TFT Assistant — UI Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0e17;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  /* ─── 主窗口 ─────────────────────────────────────────── */
  .overlay {
    width: 340px;
    background: rgba(14,20,30,0.96);
    border: 1px solid #252d3d;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  /* ─── 标题栏 ─────────────────────────────────────────── */
  .header {
    background: rgba(10,14,22,0.98);
    padding: 0 10px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid #1a2030;
    cursor: move;
    user-select: none;
  }
  .dots { display:flex; gap:5px; margin-right:6px; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .dot-red   { background:#e05252; }
  .dot-amber { background:#e0a050; }
  .dot-green { background:#52c07a; }
  .header-title {
    flex:1; color:#5a7090; font-size:11px; letter-spacing:.3px;
  }
  .header-btn {
    width:22px; height:22px; border:none; background:transparent;
    color:#5a7090; cursor:pointer; border-radius:4px;
    font-size:12px; display:flex; align-items:center; justify-content:center;
    transition: background .15s, color .15s;
  }
  .header-btn:hover { background:#1e2a3a; color:#e2e8f0; }
  .header-btn.close:hover { background:#6b1a1a; color:#ff7070; }

  /* ─── 顶栏：下拉 + 统计 ─────────────────────────────── */
  .top-bar {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0e141e;
  }
  .comp-select {
    flex: 1;
    background: #1a2030;
    border: 1px solid #252d3d;
    border-radius: 5px;
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    appearance: none;
    outline: none;
  }
  .comp-select option { background: #1a2030; }
  .stat-placement {
    color: #c89b3c;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .stat-winrate {
    color: #6a8a9e;
    font-size: 10px;
    white-space: nowrap;
  }

  /* ─── 分割线 ─────────────────────────────────────────── */
  .divider {
    height: 1px; background: #1c2535;
    margin: 0;
  }

  /* ─── 羁绊行 ─────────────────────────────────────────── */
  .traits-row {
    padding: 7px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: #0e141e;
  }
  .chip {
    background: #1a2535;
    border: 1px solid #2a3a52;
    border-radius: 3px;
    color: #c8d4e0;
    font-size: 10px;
    padding: 2px 6px;
    white-space: nowrap;
  }

  /* ─── 英雄网格 ────────────────────────────────────────── */
  .units-grid {
    padding: 10px 10px 6px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #0e141e;
  }
  .unit-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
  }
  .avatar-wrap {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 6px;
    overflow: visible;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    background-size: cover;
    background-position: center;
    background-color: #1a2535;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .cost-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #0a0c10;
    z-index: 2;
  }
  .item-row {
    display: flex;
    gap: 2px;
    margin-top: -8px;   /* 与头像重叠 */
    position: relative;
    z-index: 1;
  }
  .item-icon {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    background-size: cover;
    background-position: center;
    background-color: #252d3d;
    border: 1px solid #0a0c10;
  }
  .unit-name {
    color: #8a9aaa;
    font-size: 9px;
    margin-top: 3px;
    text-align: center;
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ─── 散件行 ─────────────────────────────────────────── */
  .comps-row {
    padding: 7px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    background: #0e141e;
  }
  .comps-label {
    color: #5a7090;
    font-size: 10px;
    margin-right: 2px;
  }
  .comp-chip {
    background: #1a2535;
    border: 1px solid #2a3a52;
    border-radius: 3px;
    color: #c0ccd8;
    font-size: 9px;
    padding: 1px 5px;
  }

  /* ─── 变体区块 ────────────────────────────────────────── */
  .variants-section { background: #0e141e; }
  .variants-header {
    padding: 8px 12px;
    cursor: pointer;
    color: #5a7090;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-top: 1px solid #1c2535;
    user-select: none;
    transition: color .15s, background .15s;
  }
  .variants-header:hover { background:#14202e; color:#a0b4c8; }
  .variants-body {
    display: none;
    padding: 2px 10px 8px;
  }
  .variants-body.open { display: block; }
  .variant-row {
    background: #14202e;
    border-radius: 5px;
    padding: 5px 8px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
  }
  .var-label { color: #c89b3c; font-weight: 700; white-space:nowrap; }
  .var-units { color: #6a8a9e; }

  /* ─── 展示多个阵容（仅预览用） ───────────────────────── */
  .preview-list {
    display: flex;
    flex-direction: column;
    gap: 32px;
    align-items: center;
  }
  .preview-title {
    color: #3a4a5a;
    font-size: 11px;
    text-align: center;
    margin-bottom: 8px;
  }
</style>
</head>

function buildOverlay(comp) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
  <div class="preview-title">${comp.name}</div>
  <div class="overlay" id="overlay-${comp.slug}">

    <div class="header">
      <div class="dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-amber"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="header-title">TFT Assistant</div>
      <button class="header-btn" title="刷新">⟳</button>
      <button class="header-btn" title="最小化">—</button>
      <button class="header-btn close" title="关闭">✕</button>
    </div>

    <div class="top-bar">
      <select class="comp-select">
        ${COMPS.map(c => `<option value="${c.slug}" ${c.slug===comp.slug?'selected':''}>${c.name}${c.cost ? '  ★'+c.cost : ''}</option>`).join('')}
      </select>
      <span class="stat-placement">★ ${comp.avg_placement}</span>
      <span class="stat-winrate">胜率 ${comp.win_rate}%</span>
    </div>

    <div class="divider"></div>

    <div class="traits-row">
      ${comp.traits.map(t => `<span class="chip">${t}</span>`).join('')}
    </div>

    <div class="divider"></div>

    <div class="units-grid">
      ${comp.units.map(u => `
        <div class="unit-card">
          <div class="avatar-wrap">
            <div class="avatar" style="background-image:url(${u.icon});border-color:${COST_COLORS[u.cost]||'#5d6168'}">
            </div>
            <div class="cost-badge" style="background:${COST_COLORS[u.cost]||'#5d6168'}">${u.cost}</div>
          </div>
          <div class="item-row">
            ${u.items.map(it => `<div class="item-icon" style="background-image:url(${it.icon})"></div>`).join('')}
          </div>
          <div class="unit-name">${u.name.substring(0,5)}</div>
        </div>
      `).join('')}
    </div>

    <div class="divider"></div>

    <div class="comps-row">
      <span class="comps-label">散件</span>
      ${comp.required_components.map(c => `<span class="comp-chip">${c}</span>`).join('')}
    </div>

    <div class="variants-section">
      <div class="variants-header" onclick="toggleVariants(this)">
        <span class="arrow">▶</span> 变体阵容 (${comp.variants.length})
      </div>
      <div class="variants-body">
        ${comp.variants.map((v,i) => `
          <div class="variant-row">
            <span class="var-label">变体${i+1}</span>
            <span class="var-units">${v.units.map(u=>u.name.substring(0,4)).join('  ')}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
  return wrap;
}

function toggleVariants(header) {
  const body  = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  const open  = body.classList.toggle('open');
  arrow.textContent = open ? '▼' : '▶';
}

// 渲染前3个阵容作为预览
const root = document.getElementById('root');
COMPS.slice(0, 3).forEach(c => root.appendChild(buildOverlay(c)));
</script>
